name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_PASSWORD: ci-test-password
      DASHBOARD_CSRF_SECRET: ci-csrf-secret
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        # Node 22 is the supported baseline for yt-dlp's JavaScript runtime and
        # matches package.json, Docker, Render, and the VPS deployer.

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint-free syntax check
        run: |
          # Syntax-check EVERY JavaScript file in the repo (not just a curated
          # subset). This catches a broken module the moment it's committed.
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(git ls-files '*.js')
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All syntax checks passed."

      - name: Load-test every module (import smoke)
        env:
          ANIME_DISABLE_WORKER: "1"
          MEDIA_PROXY_SECRET: ci-media-secret
          PORTAL_SESSION_SECRET: ci-portal-secret
          DASHBOARD_CSRF_SECRET: ci-csrf-secret
        run: |
          # Require every non-boot module with an explicit relative path. Any
          # load-time failure is a real CI failure, not a warning.
          fail=0
          while IFS= read -r f; do
            case "$f" in
              src/index.js|src/dashboard.js|src/server.js|src/templates/*) continue ;;
            esac
            node -e "require('./$f')" 2>/dev/null || { echo "LOAD FAIL: $f"; fail=$((fail + 1)); }
          done < <(git ls-files 'src/*.js' 'src/**/*.js')
          if [ "$fail" -ne 0 ]; then
            echo "Import smoke found $fail module(s) that failed to load."
            exit 1
          fi
          echo "All modules loaded."

      - name: Run academy + dashboard test suite
        env:
          ANIME_DISABLE_WORKER: "1"
          MEDIA_PROXY_SECRET: ci-media-secret
          PORTAL_SESSION_SECRET: ci-portal-secret
          DASHBOARD_CSRF_SECRET: ci-csrf-secret
        run: npm test
