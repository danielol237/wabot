name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_PASSWORD: ci-test-password
      DASHBOARD_CSRF_SECRET: ci-csrf-secret
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint-free syntax check
        run: |
          # Syntax-check EVERY JavaScript file in the repo (not just a curated
          # subset). This catches a broken module the moment it's committed.
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(git ls-files '*.js')
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All syntax checks passed."

      - name: Load-test every module (import smoke)
        run: |
          # Require every tool/handler module once to catch circular/load-time
          # errors. Skip entrypoints that start servers/network (index.js,
          # dashboard.js, server.js) which would hang the CI job.
          fail=0
          while IFS= read -r f; do
            case "$f" in
              *src/index.js|*src/dashboard.js|*src/server.js|*src/templates/*) continue ;;
            esac
            node -e "require('$f')" 2>/dev/null || { echo "LOAD FAIL: $f"; fail=1; }
          done < <(git ls-files 'src/*.js' 'src/**/*.js')
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All modules loaded."

      - name: Run academy + dashboard test suite
        run: npm test
